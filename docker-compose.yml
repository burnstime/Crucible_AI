services:
  api:
    build: .
    command: ["uvicorn", "crucible.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - CANARY_PERCENTAGE=${CANARY_PERCENTAGE}
    volumes:
      - ./logs:/app/logs:rw
      - ./models:/app/models:rw
      - ./experiments:/app/experiments:rw
    restart: unless-stopped
    depends_on:
      - redis
      - mlflow
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 2g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: false  # Set to true if possible
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    entrypoint: ["/bin/sh", "/entrypoint-secrets.sh", "minio", "server", "/data"]
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      # fallback for dev/local, overridden by entrypoint in prod
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./infra/docker/minio:/data
      - ./infra/docker/entrypoint-secrets.sh:/entrypoint-secrets.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1g
    cpus: 0.5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./infra/docker/mlflow:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1g
    cpus: 0.5

  worker:
    build: .
    command: ["celery", "-A", "crucible.scheduler.retrain_worker", "worker", "--loglevel=info"]
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./experiments:/app/experiments
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "crucible.scheduler.retrain_worker", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 2g
    cpus: 1.0

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

secrets:
  minio_root_user:
    file: ./minio_root_user.txt
  minio_root_password:
    file: ./minio_root_password.txt
